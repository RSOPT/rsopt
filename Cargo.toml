[package]
name = "rsopt"
description = "A simple, elegant convex optimization solver."
license = "MIT"
repository = "https://github.com/RSOPT/rsopt"
version = "0.0.1"
edition = "2024"

[lib]
name = "rsopt"
path = "src/lib.rs"

[dependencies]
nalgebra = { version = "0.35.0", default-features = false, features = ["macros", "nalgebra-macros"] }
